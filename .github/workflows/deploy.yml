name: Deploy to GitHub Pages

# 只有 main 分支的推送才部署；也支持手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消排队中的旧任务，但不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # 用 npm install 而不是 npm ci：
        #   esbuild 通过 optionalDependencies 分发各平台原生二进制，
        #   在 Windows 上生成的 lock 会剔除 win32 自身的包，
        #   而 npm ci 是严格模式，跨平台安装时会直接失败。
        #   这里 `npm install` 会按运行平台补齐所需包，更稳。
        run: npm install --no-audit --no-fund

      - name: Verify lock file
        run: npm run check:lock

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Vite 的 base 在 vite.config.ts 里写死了 /wordrealm/，
        # 因为 GitHub Pages 的项目站点路径就是 https://<user>.github.io/<repo>/
        run: npm run build

      - name: Verify build output
        # 这几项缺任何一个，Pages 上都会白屏 —— 与其部署完在手机上看白屏，
        # 不如在构建阶段就失败。
        run: |
          set -e
          test -f dist/index.html || { echo "❌ 缺少 dist/index.html"; exit 1; }
          test -f dist/sw.js || { echo "❌ 缺少 dist/sw.js（Service Worker 没被复制）"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "❌ 缺少 manifest"; exit 1; }
          test -f dist/icons/icon-192.png || { echo "❌ 缺少图标"; exit 1; }
          test -f dist/icons/apple-touch-icon.png || { echo "❌ 缺少 iOS 图标"; exit 1; }
          test -f dist/art/avatar.png || { echo "❌ 缺少立绘"; exit 1; }

          # 词库必须是静态资源（public/data/），不能是被打包的 JS 模块。
          # 打成 JS 模块会触发严格 MIME 校验，线上直接白屏（真实踩过）。
          test -f dist/data/seeds.json || { echo "❌ 缺少 dist/data/seeds.json"; exit 1; }
          if ls dist/assets/seeds-*.json >/dev/null 2>&1; then
            echo "❌ 词库被当成构建资源了，应放在 public/data/ 作为静态资源"
            exit 1
          fi

          # 产物里的资源路径必须是相对路径。
          # 绝对路径（/assets/...）在 Pages 子目录下会 404。
          if grep -qE '(src|href)="/assets/' dist/index.html; then
            echo "❌ index.html 里存在绝对路径资源引用，Pages 子目录下会 404"
            grep -nE '(src|href)="/assets/' dist/index.html
            exit 1
          fi

          echo "✅ 产物检查通过"
          du -sh dist
          find dist -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
