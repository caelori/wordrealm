name: Deploy to GitHub Pages

# 只有 main 分支的推送才部署；也支持手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消排队中的旧任务，但不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Vite 的 base 在 vite.config.ts 里写死了 /wordrealm/，
        # 因为 GitHub Pages 的项目站点路径就是 https://<user>.github.io/<repo>/
        run: npm run build

      - name: Verify build output
        # 这几项缺任何一个，Pages 上都会白屏 —— 与其部署完再排查，不如在这里就失败
        run: |
          set -e
          test -f dist/index.html || { echo "❌ 缺少 dist/index.html"; exit 1; }
          test -f dist/sw.js || { echo "❌ 缺少 dist/sw.js（Service Worker 没被复制）"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "❌ 缺少 manifest"; exit 1; }
          test -f dist/icons/icon-192.png || { echo "❌ 缺少图标"; exit 1; }
          test -f dist/art/avatar.png || { echo "❌ 缺少立绘"; exit 1; }

          # 词库必须打进产物，否则手机上会卡在"首次导入"
          if ! ls dist/assets/seeds-*.json >/dev/null 2>&1; then
            echo "❌ 找不到 seeds 词库文件"; exit 1
          fi

          echo "✅ 产物检查通过"
          du -sh dist
          find dist -maxdepth 1 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
